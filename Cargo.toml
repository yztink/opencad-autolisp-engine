[workspace]
resolver = "2"
members = [
    "crates/lisp-core",
    "crates/lisp-cad",
    "crates/lisp-repl",
    "crates/lisp-c-api",
    "crates/lisp-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
authors = ["OpenCAD Studio Developers"]

[workspace.dependencies]
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rustyline = "15.0"

[profile.dev.package.lisp-core]
opt-level = 1

